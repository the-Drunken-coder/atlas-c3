name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: atlas-core/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: atlas-core
          args: --timeout=5m

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: atlas-core/go.sum
      - run: go test -short -race ./...

  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_core
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: atlas-core/go.sum
      - run: go test -race ./...
        env:
          ATLAS_CORE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/atlas_core?sslmode=disable

  startup-test:
    runs-on: ubuntu-latest
    env:
      ATLAS_DATA_FUSION_STACK: baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start Atlas Core via CLI
        run: python atlas-core/tools/atlas-core-cli/main.py start
